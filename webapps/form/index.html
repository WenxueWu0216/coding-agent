<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Contact us</title><link rel="stylesheet" href="../style.css"></head>
<body>
<h1>Contact us</h1>
<form id="contact">
  <label for="name">Full name</label>
  <input id="name" name="name" placeholder="Ada Lovelace" required>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required>
  <label for="topic">Topic</label>
  <select id="topic" name="topic"><option>General</option><option>Billing</option><option>Support</option></select>
  <label><input type="checkbox" id="subscribe" name="subscribe"> Subscribe to updates</label>
  <label for="message">Message</label>
  <textarea id="message" name="message" rows="3"></textarea>
  <div><button id="submit-btn" type="submit">Submit</button></div>
</form>
<p id="result" role="status"></p>
<script>
document.getElementById('contact').addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const sub = f.get('subscribe') ? ' You are subscribed.' : '';
  document.getElementById('result').textContent =
    `Thanks, ${f.get('name')}! We will reply to ${f.get('email')} about ${f.get('topic')}: "${f.get('message')}".${sub}`;
});
</script>
</body></html>
