<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign up</title><link rel="stylesheet" href="../style.css"></head>
<body>
<h1>Create your account</h1>
<p id="progress">Step 1 of 3</p>
<section id="step1">
  <h2>Account</h2>
  <nav class="actions"><button class="next">Next</button><button class="back" disabled>Back</button></nav>
  <p><label for="username">Username</label><input id="username"></p>
  <p><label for="plan">Plan</label><select id="plan"><option>Free</option><option>Pro</option><option>Team</option></select></p>
</section>
<section id="step2" hidden>
  <h2>Address</h2>
  <nav class="actions"><button class="next">Next</button><button class="back">Back</button></nav>
  <p><label for="city">City</label><input id="city"></p>
  <p><label for="country">Country</label><select id="country"><option>UK</option><option>France</option><option>USA</option></select></p>
</section>
<section id="step3" hidden>
  <h2>Review</h2>
  <nav class="actions"><button class="finish">Finish</button><button class="back">Back</button></nav>
  <p id="review"></p>
</section>
<p id="summary" role="status"></p>
<script>
let step = 1;
const v = id => document.getElementById(id).value;
function show(n) {
  step = n;
  for (const i of [1, 2, 3]) document.getElementById('step' + i).hidden = i !== n;
  document.getElementById('progress').textContent = `Step ${n} of 3`;
  if (n === 3) document.getElementById('review').textContent = `${v('username')} on the ${v('plan')} plan, ${v('city')}, ${v('country')}`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.classList.contains('next')) {
    if (step === 1 && !v('username')) return alert('Username is required');
    show(step + 1);
  } else if (b.classList.contains('back')) show(step - 1);
  else if (b.classList.contains('finish'))
    document.getElementById('summary').textContent = `Account created: ${v('username')}, ${v('plan')} plan, ${v('city')}, ${v('country')}`;
});
</script>
</body></html>
